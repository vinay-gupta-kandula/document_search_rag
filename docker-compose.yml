services:
  db:
    image: postgres:15-alpine
    container_name: rag_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-rag_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-rag_password}
      - POSTGRES_DB=${DB_NAME:-rag_metadata_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-rag_metadata_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  vector_db:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant_vector_db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || curl -s -f http://localhost:6333/healthz || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      vector_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  qdrant_storage:
